name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # इसे वापस 20 कर दिया है

      - name: Setup Java
        uses: actions/setup-java@v4 # इसे वापस v4 कर दिया है ताकि कंपैटिबिलिटी बनी रहे
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps # किसी भी लाइब्रेरी विवाद को रोकने के लिए

      - name: Prepare web files
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceSoft-Cabs-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
