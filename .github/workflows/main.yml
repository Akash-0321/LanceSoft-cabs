name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # लेटेस्ट Node वर्जन पर अपडेट किया

      - name: Setup Java
        uses: actions/setup-java@v5 # v4 की जगह v5 किया ताकि वार्निंग न आए
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci # npm install से बेहतर और क्लीन इंस्टॉलेशन के लिए

      - name: Prepare web files
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true # अगर पहले से ऐड है तो एरर न आए

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace # क्लीन बिल्ड कमांड

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceSoft-Cabs-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk # पाथ को डायनामिक किया ताकि सही APK मिले
